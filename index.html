<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JetLag: TN</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#263343">
<link rel="icon" href="icon-192.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --felt:#263343; --felt-dark:#1c2632; --card:#fff; --ink:#1b1b1b; --red:#e8383d; --orange:#eb7944; --yellow:#f7b64d;
  --back:#e8383d; --text:#e8e8e8; --muted:#a3abb5; --btn:#f7b64d; --btn-ink:#263343;
}
*,*::before,*::after{box-sizing:inherit}
html,body{overscroll-behavior-y:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,var(--felt),var(--felt-dark));
  color:var(--text);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:6px;z-index:5;background:linear-gradient(90deg,#e8383d 0 33.3%,#eb7944 33.3% 66.6%,#f7b64d 66.6%)}
.sub{margin:0 0 20px;color:var(--muted);font-size:.95rem}
h2{font-size:1rem;font-weight:600;color:var(--muted);margin:0 0 10px}
.card{font-size:15px;width:10em;height:14em;border-radius:.8em;background:var(--card);color:var(--ink);position:relative;
  box-shadow:0 6px 18px rgba(0,0,0,.4);user-select:none;flex:none}
.card.sm{font-size:10px}
.play{display:block;margin:8px auto 0;padding:3px 14px;font-size:.85rem;background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700}
.pl{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(0,0,0,.22);border-radius:8px;padding:8px 14px;margin-bottom:6px}
.pl b{font:700 1.5rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.15em;color:var(--btn)}
.txt{position:absolute;inset:0;padding:.8em;display:flex;flex-direction:column;overflow:hidden;color:#202c3e;text-align:left;font-family:Montserrat,system-ui,Arial,sans-serif}
.txt h3{margin:0 0 .75em;font-size:.72em;line-height:1.04;font-weight:900;text-transform:uppercase}
.txt p{margin:0;font-size:.4em;line-height:1.13}
.txt.long p{font-size:.36em}
.txt b{margin-top:auto;padding-top:.5em;font-size:.52em;line-height:1.12;font-weight:800}
.b{font-style:normal;font-weight:800;background:#ffc800;color:#263343;border-radius:.25em;padding:0 .3em}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;padding:16px;cursor:pointer}
#zoom[hidden]{display:none}
#zoom .card{font-size:min(8.8vw,calc((100vh - 210px)/14),38px)}
.za{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;cursor:default}
#zoom .zt{max-width:92vw;text-align:center}
.zt{color:var(--muted);font-size:.9rem}
.zb{display:block;margin:6px auto 0;padding:2px 10px;font-size:.8rem;background:transparent;color:var(--muted);border-color:rgba(232,232,232,.25)}
.pl{width:100%;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
input{font:inherit;border-radius:8px;border:1px solid rgba(232,232,232,.4);padding:10px 12px;background:transparent;color:var(--text);min-width:0}
input::placeholder{color:var(--muted)}
#fx{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#363e4e,#0e131a);display:flex;align-items:center;justify-content:center;z-index:60;overflow:auto;padding:16px}
#fx[hidden]{display:none}
#sp{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fxbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto}
.fxbox .card{font-size:min(8vw,calc((100vh - 300px)/14),34px);animation:fxin .8s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 40px rgba(247,182,77,.55),0 8px 24px rgba(0,0,0,.5)}
@keyframes fxin{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.fxlab{color:var(--text);font-size:1.05rem;text-align:center}
.fxcode{font:700 2.1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--btn)}
.sparkle{position:absolute;color:#f7b64d;text-shadow:0 0 8px #f7b64d;animation:spark var(--d) ease-out var(--dl) both}
@keyframes spark{0%{transform:translate(0,0) scale(0) rotate(0);opacity:0}25%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1) rotate(200deg);opacity:0}}
.twinkle{animation:tw 1.8s ease-in-out var(--dl) infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sparkle{display:none}.fxbox .card{animation:none}}
[hidden]{display:none!important}
#game,#seeker{display:flex;flex-direction:column;align-items:center;width:100%}
#game[hidden],#seeker[hidden]{display:none}
.home{min-height:85vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;max-width:420px}
.home .sub{margin:0 0 6px}
.home input{width:100%;font-size:1.1rem;padding:14px;text-align:center}
.home button.big{width:100%;font-size:1.15rem;font-weight:700;padding:16px;min-height:58px;line-height:1.2}
.logo{width:170px;height:170px;border-radius:28px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.big.alt{background:var(--orange);color:var(--btn-ink);border-color:var(--orange);font-weight:700}
.who{margin:0 0 6px;color:var(--btn);font-size:.95rem}
.view{width:100%;display:flex;flex-direction:column;align-items:center}
.view[hidden]{display:none}
.tabs{display:flex;margin:4px 0 14px;border:1px solid rgba(232,232,232,.4);border-radius:10px;overflow:hidden}
.tabs button{border:0;border-radius:0;background:transparent;color:var(--text);padding:10px 28px}
.tabs button.on{background:var(--btn);color:var(--btn-ink);font-weight:700}
#mapBox{position:relative;width:100%;max-width:760px;height:calc(100vh - 250px);min-height:340px;border-radius:12px;overflow:hidden;background:#dfe6d6;touch-action:none;user-select:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#mapTiles{position:absolute;inset:0;z-index:0;isolation:isolate}
#mapTiles img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
#mapSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.mapctl{position:absolute;z-index:2;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:42px;height:42px;padding:0;font-size:1.3rem;background:#fff;color:#222;border:1px solid #bbb}
.mapctl button.on{background:#eb7944;color:#fff;border-color:#eb7944}
.mapat{position:absolute;z-index:2;right:0;bottom:0;background:rgba(255,255,255,.82);color:#333;font:11px Arial,sans-serif;padding:2px 6px;text-decoration:none}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:12px 0 2px;width:100%;max-width:760px}
.mapbar button{padding:8px 12px;font-size:.9rem}
.mapbar .drawmsg{width:100%;text-align:center;color:var(--btn);font-size:.9rem}
.mapbar .sw{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid #fff}
.mapbar .sw.on{outline:3px solid var(--btn);outline-offset:2px}
#mapBox.inking{cursor:crosshair}
.qcat{width:100%;max-width:760px;margin:0 0 16px;background:rgba(0,0,0,.2);border-radius:12px;padding:14px 14px 6px}
.qcat h2{margin:0;font-size:1.15rem;color:var(--btn);display:flex;justify-content:space-between;align-items:baseline}
.qcat h2 small{font-size:.8rem;color:var(--muted);font-weight:400}
.qtpl{margin:6px 0 10px;color:var(--text);font-size:.95rem;font-style:italic}
.qi{display:flex;align-items:center;gap:12px;padding:10px 4px;min-height:46px;border-top:1px solid rgba(232,232,232,.12);cursor:pointer}
.qi input{width:22px;height:22px;accent-color:var(--btn);flex:none;margin:0;cursor:pointer}
.qn{color:var(--muted);min-width:1.7em}
.qt{flex:1}
.qi.done .qt,.qi.done .qn{text-decoration:line-through;opacity:.45}
.ver{margin:18px 0 0;color:var(--muted);font-size:.8rem;text-align:center}
.ver .link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px;font:inherit;cursor:pointer}
#errbar{position:fixed;left:8px;right:8px;bottom:8px;z-index:300;background:#e8383d;color:#fff;border-radius:10px;padding:10px 12px;font:13px/1.35 system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.5)}
#errbar button{margin-top:8px;background:#fff;color:#263343;border:0;border-radius:8px;padding:8px 14px;font:700 13px system-ui,sans-serif;cursor:pointer}
.qa{color:var(--orange);font-size:.8rem;display:block}

/* ---- polish ---- */
button{min-height:44px;transition:transform .08s ease,filter .15s ease,background .15s ease}
button:active:not(:disabled){transform:scale(.97);filter:brightness(1.08)}
button.primary{box-shadow:0 3px 0 rgba(0,0,0,.28),0 6px 14px rgba(0,0,0,.18)}
.stripes{display:flex;width:104px;height:6px;border-radius:3px;overflow:hidden;margin:8px auto 14px}
.stripes i{flex:1}
.stripes i:nth-child(1){background:#e8383d}.stripes i:nth-child(2){background:#eb7944}.stripes i:nth-child(3){background:#f7b64d}
.home button.big{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.home button.big small{font-size:.78rem;font-weight:500;opacity:.8}
.home .sub{font-size:1rem}
.panel{background:rgba(255,255,255,.045);border:1px solid rgba(232,232,232,.1);border-radius:16px;padding:12px 12px 6px}
.tabs{box-shadow:0 2px 10px rgba(0,0,0,.2)}
.tabs button{min-height:46px;font-size:1rem}
h2{letter-spacing:.01em}
.qcat h2{cursor:pointer;-webkit-user-select:none;user-select:none}
.qcat h2 small{white-space:nowrap}
.qbar{height:6px;border-radius:3px;background:rgba(232,232,232,.12);overflow:hidden;margin:8px 0 8px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#e8383d,#eb7944,#f7b64d);border-radius:3px;transition:width .3s ease}
.qi{border-radius:8px}
.qi:active{background:rgba(247,182,77,.1)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:90;background:#1c2632;color:#e8e8e8;border:1px solid rgba(247,182,77,.55);padding:10px 18px;border-radius:999px;font-weight:700;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:90vw;text-align:center;transition:opacity .2s ease,transform .2s ease}
#toast.on{opacity:1;transform:translate(-50%,0)}
.card:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){button,.card,#toast,.qbar i{transition:none}}
@media (hover:none){.hint{display:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:760px;margin:10px 0 2px}
.lchip{min-width:38px;height:34px;padding:0 10px;border-radius:17px;color:#fff;font-weight:800;font-size:.9rem;border:2px solid rgba(255,255,255,.92);cursor:pointer;min-height:34px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.lchip.off{opacity:.3;text-decoration:line-through}
#lineNote{white-space:pre-line}
.tag{position:absolute;top:.5em;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);font:700 .9em Arial,sans-serif;padding:1px 6px;border-radius:4px}
.card.dimmed{opacity:.4}
.card svg{position:absolute;inset:0;width:100%;height:100%}
.card.red{color:var(--red)}
.corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;font-size:1.5em;font-weight:700}
.corner.tl{top:.5em;left:.5em}
.corner.br{bottom:.5em;right:.5em;transform:rotate(180deg)}
.corner small{font-size:.87em;font-weight:400;margin-top:2px}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:4.6em}

.empty{background:transparent;border:2px dashed rgba(232,232,232,.3);box-shadow:none;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:.95rem;text-align:center;padding:10px}
.card.empty.sm{font-size:10px}
.pop{animation:flip .35s ease-out}
@keyframes flip{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
.sec{width:100%;max-width:760px;margin-bottom:22px}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.deckwrap{text-align:center;color:var(--muted);font-size:.9rem}
.deckwrap .card{margin-bottom:8px}
.cardbtn{background:none;border:0;padding:0;border-radius:.8em;cursor:pointer;display:block;font:inherit;color:inherit;position:relative}
.cardbtn.sel .card{outline:4px solid var(--btn);outline-offset:3px}
.cardbtn.dim{opacity:.45}
.cardbtn:hover .card{transform:translateY(-4px)}
.card{transition:transform .12s}
.rm{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;padding:0;background:var(--back);color:#fff;
  border:2px solid var(--card);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot{position:relative}
.msg{min-height:1.4em;text-align:center;color:var(--btn);margin:0 0 12px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px}
button,select{font:inherit;border-radius:8px;border:1px solid rgba(232,232,232,.4);padding:10px 16px;cursor:pointer}
button.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn);font-weight:700;font-size:1.05rem;padding:12px 28px}
button.ghost,select{background:transparent;color:var(--text)}
select option{color:#111}
button:disabled,select:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
label.opt{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.95rem}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px}
</style>

const CURSE={};
for(const [k,t,b,c,r] of CURSES){CURSE[k]={t,b,c,r};POW[k]={name:t}}

<script>
/* ---------- the game is saved after every move, so reloading changes nothing ---------- */
const SAVE_KEY="bc_game_v1";
function saveGame(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:1,deck,hand,pending,sel,discarded,limit,
    played:played.map(e=>({n:e.n,code:e.code,card:e.card,t:e.t,p:e.p}))}))}catch(_){}
}
const validCard=c=>!!c&&typeof c.k==="string"&&(c.k==="time"?typeof c.m==="number"&&!!COL[c.m]:!!POW[c.k]);
function loadGame(){
  try{
    const g=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!g||g.v!==1)return false;
    if(![g.deck,g.hand,g.pending].every(a=>Array.isArray(a)&&a.every(validCard)))return false;
    if(!Array.isArray(g.played)||!g.played.every(e=>e&&typeof e.n==="string"&&typeof e.code==="string"&&e.card&&!!POW[e.card.k]))return false;
    if(!(g.discarded>=0)||g.deck.length+g.hand.length+g.pending.length+g.discarded!==build().length)return false;
    deck=g.deck;hand=g.hand;pending=g.pending;discarded=g.discarded;limit=Math.max(6,g.limit|0);played=g.played;
    sel=Number.isInteger(g.sel)&&g.sel>=0&&g.sel<pending.length?g.sel:null;mode=null;
    render();return true;
  }catch(_){return false}
}
// extra friction for reloading (the saved game already makes a reload harmless)
window.addEventListener("beforeunload",e=>{if(window.__noUnloadPrompt)return;e.preventDefault();e.returnValue=""});
document.addEventListener("keydown",e=>{if(e.key==="F5"||((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==="r"))e.preventDefault()},true);
;(window.__steps=window.__steps||[]).push("savegame");
</script>
<script>
/* ---------- game logic ---------- */
function reset(){deck=shuffle(build());hand=[];pending=[];sel=null;discarded=0;mode=null;limit=6;played=[];render()}
function drawToHand(n){const g=deck.splice(0,Math.min(n,deck.length));g.forEach(c=>c.fresh=true);hand.push(...g)}
function draw(){
  if(pending.length||mode||!deck.length)return;
  pending=deck.splice(0,Math.min(+$("n").value,deck.length));sel=null;render(true);
  if(typeof buzz==="function")buzz();if(typeof toast==="function")toast(pending.length>1?"🎴 Drew "+pending.length+" cards":"🎴 Drew a card");
}
function pick(i){
  if(hand.length<limit){const c=pending[i];c.fresh=true;hand.push(c);discarded+=pending.length-1;pending=[];sel=null}
  else sel=i;
  render();
}
function swapWith(i){
  if(sel===null)return;
  const c=pending[sel];c.fresh=true;hand[i]=c;discarded+=pending.length;pending=[];sel=null;render();
}
function removeFromHand(i){hand.splice(i,1);discarded++;render();if(typeof toast==="function")toast("🗑️ Removed from your hand")}
function discardPending(){discarded+=pending.length;pending=[];sel=null;render();if(typeof toast==="function")toast("🗑️ Discarded")}

function feasible(k,src){
  if(k==="x1"||FUN.includes(k))return true;
  if(CURSE[k]){const r=CURSE[k].r;if(r.d)return hand.length-1>=r.d;if(r.tb)return hand.some((c,i)=>i!==src&&c.k==="time");return true}
  if(k==="dup")return hand.some((c,i)=>i!==src&&c.k!=="dup");
  return hand.length-1>=POW[k].need;
}
function play(i){
  const c=hand[i];
  if(pending.length||mode||c.k==="time"||!feasible(c.k,i))return;
  if(c.k==="dup"){mode={t:"dup",src:i};render()}else begin(c.k,i);
}
function begin(k,src){
  if(k==="x1"){hand.splice(src,1);discarded++;limit++;mode=null;drawToHand(1);render();celebrate(mkEntry("x1"));return}
  if(FUN.includes(k)){mode={t:"fun",k,src};render();return}
  if(CURSE[k]){const r=CURSE[k].r;
    mode=(r.d||r.tb)?{t:"disc",src,need:r.d||r.tb,draw:0,pool:r.tb?"time":null,curse:k,picked:[]}:{t:"fun",k,src};
    render();return}
  mode={t:"disc",k,src,need:POW[k].need,draw:POW[k].draw,picked:[]};render();
}
function togglePick(i){
  const x=mode.picked.indexOf(i);
  if(x>=0)mode.picked.splice(x,1);else if(mode.picked.length<mode.need&&(!mode.pool||hand[i].k==="time"))mode.picked.push(i);
  render();
}
function confirmDisc(){
  const {src,picked,need,draw,curse,k}=mode;
  hand=hand.filter((_,i)=>i!==src&&!picked.includes(i));
  discarded+=need+1;
  const e=mkEntry(curse||k,curse?newCode():"");
  if(curse)played.unshift(e);
  mode=null;if(draw)drawToHand(draw);render();celebrate(e);
}
function validTarget(i){return i!==mode.src&&hand[i].k!=="dup"}
// Duplicate only makes a copy of the card. Nothing is played and nothing is discarded.
function dupTarget(j){
  const t=hand[j],c={k:t.k,copy:true,fresh:true};
  if(t.k==="time")c.m=t.m;
  hand[mode.src]=c;mode=null;render();

async function osrmRoute(ll){

  for(const base of ["https://router.project-osrm.org/route/v1/driving/","https://routing.openstreetmap.de/routed-car/route/v1/driving/"]){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);
      const r=await fetch(base+coords+"?overview=full&geometries=geojson&steps=false",{signal:c.signal});clearTimeout(t);
      if(!r.ok)continue;
      const j=await r.json();
      if(j.code!=="Ok"||!j.routes||!j.routes[0]||!j.routes[0].geometry)continue;
      const pts=j.routes[0].geometry.coordinates.map(q=>[+q[1].toFixed(5),+q[0].toFixed(5)]);
      if(pts.length>1)return {pts:dpSimplify(pts,0.00002)};

    if(ll.length<2)continue;

    LN.check[r]={n:ll.length,missing,unknown,fallback:0};

function parseLines(j){
  const out={};let routes=0;

    if(rel.type!=="relation")continue;
    const t=rel.tags||{};routes++;
    let ref=String(t.ref||"").trim();
    if(!ref){const m=/^\s*Bus\s+([^:\s]+)\s*:/i.exec(t.name||"");if(m)ref=m[1]}
    if(!/^\d{1,2}[A-Za-z]?$/.test(ref)||/^[PN]/i.test(ref))continue;     // numbered lines only, no P / N
    if(t.network&&!/Tren/i.test(t.network))continue;                      // another town's lines

  let seen=0;

    for(const base of servers){
      const host=base.split("/")[2];

        const c=new AbortController(),t=setTimeout(()=>c.abort(),60000);
        const r=await fetch(base+"?data="+encodeURIComponent(q),{signal:c.signal});clearTimeout(t);
        if(!r.ok){problems.push(host+": HTTP "+r.status);continue}

  });
}
function rText(o,t,small){const d=document.createElement("div");d.textContent=t;d.style.cssText=small?"color:#a3abb5;font-size:.9rem;max-width:340px":"font-size:1.1rem;font-weight:700;max-width:340px";o.appendChild(d);return d}
function rBtn(o,label,cls,fn){const b=document.createElement("button");b.textContent=label;b.className=cls;b.style.maxWidth="340px";b.style.width="100%";b.onclick=fn;o.appendChild(b);return b}
function askAnswer(r){
  const L=fmtDist(r);
  return rdlg((o,done)=>{
    rText(o,"📡 Radar "+L+": what did the hider answer?");
    rBtn(o,"❌ No. The hider is NOT within "+L,"primary",()=>done("no"));
    rBtn(o,"✅ Yes. The hider IS within "+L,"ghost",()=>done("yes"));
    rText(o,"No crosses out the circle. Yes crosses out everything outside it.",true);
    rBtn(o,"Cancel","ghost",()=>done(null));
  });
}
function askRadius(){
  return rdlg((o,done)=>{
    rText(o,"📡 Radar distance");
    const row=document.createElement("div");row.style.cssText="display:flex;gap:8px;width:100%;max-width:340px";
    const inp=document.createElement("input");inp.type="number";inp.min="1";inp.step="any";inp.placeholder="e.g. 500";inp.style.cssText="flex:1;font-size:1.1rem;text-align:center";
    const sel=document.createElement("select");sel.innerHTML='<option value="1">m</option><option value="1000">km</option>';sel.style.fontSize="1.1rem";
    row.append(inp,sel);o.appendChild(row);
    const err=rText(o,"",true);err.style.color="#ff9c8f";
    rBtn(o,"Use this distance","primary",()=>{const m=parseFloat(inp.value)*parseFloat(sel.value);if(!(m>=50&&m<=20000)){err.textContent="Enter a distance between 50 m and 20 km.";return}done(Math.round(m))});
    rBtn(o,"Cancel","ghost",()=>done(null));
    setTimeout(()=>inp.focus(),50);
  });
}
async function radarCenter(){
  if(M.me)return {lat:M.me.lat,lon:M.me.lon};
  const wait=document.createElement("div");
  wait.style.cssText="position:fixed;inset:0;z-index:80;background:rgba(10,15,22,.82);display:flex;align-items:center;justify-content:center;color:#e8e8e8;font:700 1.1rem system-ui,sans-serif";
  wait.textContent="📍 Finding your location...";document.body.appendChild(wait);
  const pos=await new Promise(res=>{
    if(!navigator.geolocation||window.isSecureContext===false)return res(null);
    navigator.geolocation.getCurrentPosition(p=>res(p),()=>res(null),{enableHighAccuracy:true,timeout:9000,maximumAge:5000});
  });
  wait.remove();
  if(pos)return {lat:pos.coords.latitude,lon:pos.coords.longitude};
  const ok=await rdlg((o,done)=>{
    rText(o,"Couldn't get your location.");
    rText(o,"Use the middle of the map as the radar center instead? (Turn on My location on the map to use your real position.)",true);
    rBtn(o,"Use the middle of the map","primary",()=>done(true));
    rBtn(o,"Cancel","ghost",()=>done(false));
  });
  return ok?{lat:unmy(M.cy),lon:M.cx*360-180}:null;
}
function focusRadar(it){
  M.cx=mx(it.lon);M.cy=my(it.lat);
  const px=0.32*Math.min(M.w||360,M.h||500);
  M.z=Math.log2(156543.03392*Math.cos(it.lat*Math.PI/180)*px/it.r);
  M.moved=true;mapClamp();mapRender();
}
async function radarToggle(i,checked,key){
  if(!checked){qDone.delete(key);saveQ();R.items=R.items.filter(x=>x.k!==key);saveRadar();radarUi();renderQs();mapRender();return}
  let r=[400,800,1600][i];
  if(!r){r=await askRadius();if(!r){renderQs();return}}
  const c=await radarCenter();if(!c){renderQs();return}
  const ans=await askAnswer(r);if(!ans){renderQs();return}
  const it={k:key,lat:c.lat,lon:c.lon,r,out:ans==="yes",t:Date.now()};
  R.items=R.items.filter(x=>x.k!==key);R.items.push(it);saveRadar();
  qDone.add(key);saveQ();radarUi();renderQs();
  if(typeof showSeekerTab==="function")showSeekerTab("map");
  focusRadar(it);
}
function radarClear(){R.items=[];saveRadar();radarUi();mapRender()}
$("bRadar").onclick=()=>{
  if(!R.items.length||!confirm("Remove all radar areas?"))return;
  for(const it of R.items)qDone.delete(it.k);saveQ();radarClear();renderQs();
};
radarUi();
;(window.__steps=window.__steps||[]).push("radar");
</script>
<script>
/* ---------- polish: little pop-up messages and a tiny buzz ---------- */
let _toastT=0;
function toast(t){
  const el=document.getElementById("toast");if(!el)return;
  el.textContent=t;el.classList.add("on");clearTimeout(_toastT);
  _toastT=setTimeout(()=>el.classList.remove("on"),1900);
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(18)}catch(_){}}
;(window.__steps=window.__steps||[]).push("polish");
</script>
<script>
let tab="cards";
function mountMap(host){
  const v=$("mapView");
  if(v.parentNode!==host)host.appendChild(v);
  v.hidden=false;
  if(!mapReady){mapReady=true;initMap()}else mapResize();
}
function showTab(t){
  tab=t;
  $("gameTitle").textContent=t==="map"?"🗺️ Hider map":"🃏 Hider deck";
  $("cardsView").hidden=t!=="cards";
  $("tabCards").classList.toggle("on",t==="cards");$("tabMap").classList.toggle("on",t==="map");
  if(t==="map")mountMap($("game"));else $("mapView").hidden=true;
}
$("tabCards").onclick=()=>showTab("cards");
$("tabMap").onclick=()=>showTab("map");
$("draw").onclick=draw;
$("shuffle").onclick=()=>{if(confirm("Start a new game? Your hand is cleared and the deck is reshuffled."))reset()};
document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!$("game").hidden&&!$("cardsView").hidden&&!["SELECT","BUTTON","INPUT"].includes(document.activeElement.tagName)){e.preventDefault();draw()}
});
if(!loadGame())reset();
initShare();
window.__mainReady=true;
;(window.__steps=window.__steps||[]).push("start");
</script>
<script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
